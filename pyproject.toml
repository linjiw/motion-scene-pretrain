[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "motion-scene-pretrain"
version = "0.1.0"
description = "Portable non-RL motion-scene representation and conditional generation experiments"
requires-python = ">=3.10"
dependencies = ["numpy>=1.26", "torch>=2.4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
